name: Permutation Benchmark

on:
  push:
    paths:
      - '**/permpure_dpp.cpp'
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSYS2 (MinGW)
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make

    - name: Compile and Run Benchmark
      shell: msys2 {0}
      run: |
        # 1. Dynamically locate the directory containing the source file
        # Using 'find' with '-name' to locate the file
        FILE_PATH=$(find . -name "permpure_dpp.cpp" | head -n 1)
        
        if [ -z "$FILE_PATH" ]; then
          echo "Error: permpure_dpp.cpp not found!"
          exit 1
        fi
        
        TARGET_DIR=$(dirname "$FILE_PATH")
        echo "Found source in: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        # 2. Compile the engine with optimization flags
        # Added -static to ensure portability on the runner
        echo "Compiling..."
        g++ -O3 -march=native permpure_dpp.cpp -o permpure_dpp.exe -static -lpthread
        
        # 3. Execute the benchmark
        echo "Running Benchmark..."
        ./permpure_dpp.exe
