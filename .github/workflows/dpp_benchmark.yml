name: DPP Performance Benchmark

on:
  push:
    paths:
      - 'Position-Pure-Algorithm/FullPermutation/permpure_dpp.cpp'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    # Corrected path: GitHub Actions clones into the repository name by default.
    # If the repo is 'Position-Pure-Algorithm', the root is '.', 
    # so we step into the subdirectories from there.
    defaults:
      run:
        working-directory: Position-Pure-Algorithm/FullPermutation
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile permpure_dpp
        run: |
          # Verify current path first to debug
          pwd
          ls -F
          g++ -O3 -march=native permpure_dpp.cpp -o permpure_dpp -lpthread

      - name: Run Benchmark (N=9 to 13)
        run: |
          for n in {9..13}; do
            ./permpure_dpp $n | grep -E "ALGORITHM|N_VALUE|EXECUTION_TIME"
          done
