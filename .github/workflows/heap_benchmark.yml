name: Permutation Benchmark

# Trigger the workflow manually or on push to the file
on:
  push:
    paths:
      - '**/heap_perm_benchmark.cpp'
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSYS2 (MinGW)
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make

    - name: Compile and Run Benchmark
      shell: msys2 {0}
      run: |
        # 1. Dynamically locate the directory containing the source file
        FILE_PATH=$(find . -name "heap_perm_benchmark.cpp" | head -n 1)
        
        if [ -z "$FILE_PATH" ]; then
          echo "Error: heap_perm_benchmark.cpp not found!"
          exit 1
        fi
        
        TARGET_DIR=$(dirname "$FILE_PATH")
        echo "Found source in: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        # 2. Compile the engine with optimization flags
        # -O3: Aggressive optimization
        # -march=native: Target current EPYC CPU architecture
        # -static: Create a portable binary
        echo "Compiling..."
        g++ -O3 -march=native heap_perm_benchmark.cpp -o heap_bench.exe -static -lpthread
        
        # 3. Execute the benchmark and capture output
        echo "Running Benchmark..."
        ./heap_bench.exe
