name: DPP Performance Benchmark

on:
  push:
    paths:
      - '**/permpure_dpp.cpp'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Run Benchmark
        run: |
          # Find the directory containing the file dynamically
          TARGET_DIR=$(find . -name "permpure_dpp.cpp" -exec dirname {} \;)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "Error: permpure_dpp.cpp not found!"
            exit 1
          fi
          
          echo "Found source in: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Compile
          g++ -O3 -march=native permpure_dpp.cpp -o permpure_dpp -lpthread
          
          # Run Benchmark
          echo "Starting DPP Performance Benchmark..."
          for n in {9..13}; do
            echo "--- Benchmarking N=$n ---"
            ./permpure_dpp $n | grep -E "ALGORITHM|N_VALUE|EXECUTION_TIME"
          done
