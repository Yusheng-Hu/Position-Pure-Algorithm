name: Heap vs PP Benchmark

on:
  push:
    paths:
      - '**/heap_perm_benchmark.cpp'
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSYS2 (MinGW)
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make

    - name: Compile and Run Benchmark
      shell: msys2 {0}
      run: |
        # 1. Dynamically locate the directory
        FILE_PATH=$(find . -name "heap_perm_benchmark.cpp" | head -n 1)
        TARGET_DIR=$(dirname "$FILE_PATH")
        cd "$TARGET_DIR"
        
        # 2. Compile
        g++ -O3 -march=native heap_perm_benchmark.cpp -o heap_bench.exe -static -lpthread
        
        # 3. Run the benchmark 3 times to observe stability
        echo "Starting 3-run stability test..."
        for i in {1..3}; do
          echo "--- Run #$i ---"
          ./heap_bench.exe
        done
