name: LexSG Benchmark

on:
  push:
    paths:
      - '**/LexSG.cpp'
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Get CPU Information
      shell: powershell
      run: |
        echo "### CPU Information"
        # Retrieve and display CPU hardware details
        Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List

    - name: Setup MSYS2 (MinGW)
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make

    - name: Compile and Run Benchmark
      shell: msys2 {0}
      run: |
        # 1. Dynamically locate the directory containing the source file
        FILE_PATH=$(find . -name "LexSG.cpp" | head -n 1)
        TARGET_DIR=$(dirname "$FILE_PATH")
        cd "$TARGET_DIR"
        
        # 2. Compile the benchmark source
        g++ -O3 -march=native LexSG.cpp -o LexSG_bench.exe -static -lpthread
        
        # 3. Run the benchmark 3 times to observe stability
        echo "Starting 3-run stability test..."
        for i in {1..3}; do
          echo "--- Run #$i ---"
          ./LexSG_bench.exe
        done
