- name: Compile and Run Benchmark
        run: |
          # Dynamically locate the directory
          TARGET_DIR=$(find . -name "permpure_dpp.cpp" -exec dirname {} \;)
          cd "$TARGET_DIR"
          
          # Compile
          g++ -O3 -march=native permpure_dpp.cpp -o permpure_dpp -lpthread
          
          # Prepare the Markdown table header
          echo "| N Value | Execution Time (s) |" >> $GITHUB_STEP_SUMMARY
          echo "|:-------:|:------------------:|" >> $GITHUB_STEP_SUMMARY
          
          # Run Benchmark and format output into the summary table
          echo "Starting DPP Performance Benchmark..."
          for n in {9..13}; do
            # Extract only the time value
            TIME_VAL=$(./permpure_dpp $n | grep "EXECUTION_TIME" | awk -F': ' '{print $2}')
            
            # Append row to the summary table
            echo "| $n | $TIME_VAL |" >> $GITHUB_STEP_SUMMARY
            echo "Finished N=$n in ${TIME_VAL}s"
          done
